version: "3.9"
services:
  bot:
    build: .
    restart: always
    env_file: .env
    depends_on: [postgres, redis]

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: polybot
      POSTGRES_PASSWORD: polybot
      POSTGRES_DB: polybot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: